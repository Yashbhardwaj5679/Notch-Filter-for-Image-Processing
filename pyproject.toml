[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notchfilter"
version = "2.0.0"
description = "Ideal, Butterworth and Gaussian notch filters for periodic noise removal in images"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21", "scipy>=1.7", "matplotlib>=3.5", "pillow>=9.0"]

[project.optional-dependencies]
ssim = ["scikit-image>=0.19"]
dev = ["pytest>=7", "scikit-image>=0.19"]

[project.scripts]
notchfilter = "notchfilter.cli:main"
notchfilter-gui = "notchfilter.gui:main"

[tool.setuptools]
packages = ["notchfilter"]

[tool.setuptools.package-data]
notchfilter = ["icon.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
